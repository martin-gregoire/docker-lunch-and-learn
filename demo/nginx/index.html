<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>lunchdemo</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; color: #333; }
    h1 { color: #0db7ed; }
    ul { list-style: none; padding: 0; }
    li { padding: 10px 14px; margin: 6px 0; background: #f5f5f5; border-radius: 4px; }
    .error { color: #c0392b; }
    footer { margin-top: 40px; font-size: 0.85em; color: #999; }
  </style>
</head>
<body>
  <h1>lunchdemo 🐳</h1>
  <p>Items from PostgreSQL via the Python API:</p>
  <ul id="items"><li>Loading…</li></ul>
  <footer>nginx → Flask API → PostgreSQL</footer>
  <script>
    fetch('/api/items')
      .then(r => r.json())
      .then(items => {
        const ul = document.getElementById('items');
        ul.innerHTML = items.length
          ? items.map(i => `<li>${i.name}</li>`).join('')
          : '<li>No items found.</li>';
      })
      .catch(() => {
        document.getElementById('items').innerHTML =
          '<li class="error">Could not reach the API.</li>';
      });
  </script>
</body>
</html>
